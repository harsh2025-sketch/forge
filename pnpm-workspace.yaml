packages:
  - "apps/*"
  - "packages/*"
  - "packages/adapters/*"
  - "tools/*"
allowBuilds:
  esbuild: false
  sharp: true
# Security overrides: Next.js pins postcss@8.4.31 and sharp@<0.35, and Vitest
# resolves vite@5.x, all of which carry open advisories. The frozen stack does
# not constrain these transitive versions; force the patched lines.
overrides:
  postcss: ^8.5.23
  sharp: ^0.35.0
  vite: ^6.4.3
minimumReleaseAgeExclude:
  - bare-url@2.5.2
  - resend@6.19.0
  - stripe@22.5.0
